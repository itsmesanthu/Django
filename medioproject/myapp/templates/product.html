<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>
    <link rel="stylesheet" href="{% static 'css/product.css' %}">
</head>
<body>
    <center><button><a href="http://127.0.0.1:8000/admin/">add product +</a></button>
        <table border="2px">
            <tr>
                <th>name</th>
                <th>price</th>
                <th>quantity</th>
                <th>description</th>
                <th>image</th>
            </tr>
            {% for i in prod %}
            <tr>
                <td>{{i.name}}</td>
                <td>{{i.price}}</td>
                <td>{{i.quantity}}</td>
                <td>{{i.description}}</td>
                <td><img src="{{i.image.url}}" height="50px" width="60px"></td>
            </tr>
            {%endfor%}
        </table>
    </center>
</body>
</html>
