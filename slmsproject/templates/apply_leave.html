<!DOCTYPE html>
<html lang="en">
<head>
     {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'account/leave.css' %}">
    <title>apply leave</title>
</head>
<body>
    <h1>leave form</h1>
    <div class="leave">
    <form method="POST">
        {% csrf_token %}
        <label>Leave type:</label>
        <select name="leave_type" required>
            <option value="">select</option>
            <option>Casual leave</option>
            <option>sick leave</option>
            <option>emergency leave</option>
        </select><br><br>
        <label>start date:</label><input type="date" name="start_date" required><br><br>
        <label>end date:</label><input type="date" name="End_date" required><br><br>
        <label>Reason:</label><input type="text" name="reason" required><br><br>
       <button type="submit">apply</button>
    </form>
    </div>
</body>
</html>
