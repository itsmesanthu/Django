<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>manage staff</title>
</head>
<body>
    <h2>Manage staff</h2>
    <a href="{% url 'add_staff'%}"> add staff</a>
    <table>
        <tr>
            <th>username</th>
            <th>Actions</th>
        </tr>
        {% for staff in staff_list %}
            <tr>
                <td>{{ staff.username }}</td>
                <td><a href="{% url 'edit' staff.id %}">edit</a></td>
                <td><a href="{% url 'delete' staff.id %}" onclick="return confirm('are you sure?')">delete</a></td>
            </tr>
        {% endfor %}
        </table>
</body>
</html>
