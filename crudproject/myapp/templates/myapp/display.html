<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>employee data</h1>
        <table border="2">
            <tr>
                <th>name</th>
                <th>age</th>
                <th>email</th>
                <th>place</th>
                <th>job</th>
                <th>salary</th>
            </tr>
              {%for i in emp%}
            <tr>
                <td>{{i.name}}</td>
                <td>{{i.age}}</td>
                <td>{{i.email}}</td>
                <td>{{i.place}}</td>
                <td>{{i.job}}</td>
                <td>{{i.salary}}</td>
                <td><a href="{% url 'update' i.id %}">Update</a></td>
                <td><a href="{% url 'delete' i.id %}">Delete</a></td>
            </tr>
                {% endfor %}
        </table>
        <p><a href="http://127.0.0.1:8000/insert/">Insert data</a></p>

    </center>
</body>
</html>
